<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#09080c" />
  <title>27</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="27" />
  <meta property="og:image" content="https://mqrkin.github.io/27/assets/og_27.jpg?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09080c;
      --surface: rgba(255, 255, 255, 0.048);
      --surface-strong: rgba(255, 255, 255, 0.09);
      --ink: #f7f4ef;
      --ink-dim: rgba(247, 244, 239, 0.52);
      --accent: #f5a623;
      --accent-2: #ff6b8b;
      --glow-a: rgba(245, 166, 35, 0.22);
      --glow-b: rgba(255, 107, 139, 0.16);
      --ring: rgba(245, 166, 35, 0.36);
    }

    body.red-room {
      --bg: #0d0508;
      --surface: rgba(255, 36, 72, 0.08);
      --surface-strong: rgba(255, 36, 72, 0.15);
      --accent: #ff2a4d;
      --accent-2: #ff6e84;
      --glow-a: rgba(255, 26, 64, 0.34);
      --glow-b: rgba(255, 0, 51, 0.22);
      --ring: rgba(255, 42, 77, 0.52);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: #09080c;
      color: var(--ink);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .ambient, .ambient-red {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      contain: strict;
    }

    /* Pure radial gradients instead of filter:blur(88px) — zero GPU stall */
    .ambient {
      background:
        radial-gradient(circle 280px at 50% 8%, rgba(245, 166, 35, 0.24) 0%, rgba(245, 166, 35, 0) 72%),
        radial-gradient(circle 260px at 88% 92%, rgba(255, 107, 139, 0.18) 0%, rgba(255, 107, 139, 0) 72%),
        #09080c;
    }

    .ambient-red {
      background:
        radial-gradient(circle 300px at 50% 8%, rgba(255, 26, 64, 0.36) 0%, rgba(255, 26, 64, 0) 72%),
        radial-gradient(circle 280px at 88% 92%, rgba(255, 0, 51, 0.24) 0%, rgba(255, 0, 51, 0) 72%),
        #0d0508;
      opacity: 0;
      will-change: opacity;
      transition: opacity 0.32s ease;
    }

    body.red-room .ambient-red {
      opacity: 1;
    }

    .siren-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      will-change: opacity;
      transition: opacity 0.18s ease;
    }

    .siren-overlay::before,
    .siren-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity;
    }

    .siren-overlay::before {
      background: linear-gradient(90deg, rgba(255, 32, 64, 0.42) 0%, rgba(255, 32, 64, 0) 34%);
    }

    .siren-overlay::after {
      background: linear-gradient(270deg, rgba(32, 130, 255, 0.42) 0%, rgba(32, 130, 255, 0) 34%);
    }

    .siren-overlay.active {
      opacity: 1;
    }

    .siren-overlay.active::before {
      animation: sirenA 0.36s steps(2, end) infinite;
    }

    .siren-overlay.active::after {
      animation: sirenB 0.36s steps(2, end) infinite;
    }

    @keyframes sirenA {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.08; }
    }

    @keyframes sirenB {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 1; }
    }

    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    .wrap {
      position: relative;
      z-index: 10;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(16px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
    }

    .switch-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.16s ease, background 0.3s ease;
    }

    .switch-btn:active {
      transform: scale(0.95);
    }

    .lamp-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .center-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .art-stage {
      position: relative;
      width: 224px;
      height: 224px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .art-img {
      width: 214px;
      height: 214px;
      object-fit: contain;
      will-change: transform;
      animation: floaty 3.8s ease-in-out infinite;
    }

    .art-stage.pop .art-img {
      animation: none;
      transform: scale(1.08) rotate(-2.5deg);
    }

    @keyframes floaty {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-1deg); }
      50% { transform: translate3d(0, -8px, 0) rotate(1.2deg); }
    }

    .timer-card {
      width: 100%;
      background: rgba(20, 17, 26, 0.78);
      border-radius: 24px;
      padding: 18px 14px 16px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    body.red-room .timer-card {
      background: rgba(34, 11, 18, 0.82);
    }

    .clock-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    .unit {
      background: rgba(0, 0, 0, 0.34);
      border-radius: 18px;
      padding: 15px 6px 13px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.25s ease, transform 0.18s ease;
    }

    .unit.tick {
      box-shadow: inset 0 0 0 1px var(--ring), 0 0 22px var(--glow-a);
      transform: scale(1.025);
    }

    .digits {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .unit-sec .digits {
      color: var(--accent);
      transition: color 0.4s ease;
    }

    .unit-label {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-dim);
      letter-spacing: 0.03em;
    }

    .colon {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink-dim);
      padding-bottom: 16px;
      opacity: 0.7;
    }

    .progress-track {
      margin-top: 16px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
    }

    .act-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.14s ease, background 0.3s ease;
    }

    .act-btn:active {
      transform: scale(0.95);
    }

    .ico {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="ambient-red"></div>
  <div class="siren-overlay" id="sirenOverlay"></div>
  <canvas id="fxCanvas"></canvas>

  <main class="wrap">
    <header class="topbar">
      <button class="switch-btn" id="lightSwitch" type="button">
        <span class="lamp-dot"></span>
        <span id="lightLabel">свитч) тёплая</span>
      </button>
    </header>

    <section class="center-stack">
      <div class="art-stage" id="artStage">
        <img class="art-img" id="artImg" src="assets/s27.webp" alt="27" />
      </div>

      <div class="timer-card">
        <div class="clock-grid">
          <div class="unit">
            <div class="digits" id="dH">00</div>
            <div class="unit-label" id="lH">часов</div>
          </div>
          <div class="colon">:</div>
          <div class="unit">
            <div class="digits" id="dM">00</div>
            <div class="unit-label" id="lM">минут</div>
          </div>
          <div class="colon">:</div>
          <div class="unit unit-sec" id="uS">
            <div class="digits" id="dS">00</div>
            <div class="unit-label" id="lS">секунд</div>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progFill"></div>
        </div>
      </div>
    </section>

    <footer class="bottom-bar">
      <button class="act-btn" id="sirenBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 18v-6a5 5 0 0 1 10 0v6"/>
          <path d="M5 21h14"/>
          <path d="M12 2v2M4.9 4.9l1.4 1.4M19.1 4.9l-1.4 1.4"/>
        </svg>
        <span>Хорни Полис</span>
      </button>
    </footer>
  </main>

  <script>
    if (window.Telegram && Telegram.WebApp) {
      try {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#09080c');
        Telegram.WebApp.setBackgroundColor('#09080c');
      } catch (_) {}
    }

    const TARGET_MS = 1795767600000; // 2026-11-27 11:20:00 MSK (UTC+3)
    const START_MS  = 1795640400000; // 2026-11-26 00:00:00 MSK

    const stickers = [
      'assets/s27.webp',
      'assets/kiss.webp',
      'assets/inf2.webp',
      'assets/bunnies.webp',
      'assets/horny_boy.webp',
      'assets/horny_girl.webp',
    ];
    let curSticker = 0;

    const artStage = document.getElementById('artStage');
    const artImg = document.getElementById('artImg');

    function setSticker(idx) {
      curSticker = ((idx % stickers.length) + stickers.length) % stickers.length;
      artStage.classList.add('pop');
      artImg.src = stickers[curSticker];
      setTimeout(() => artStage.classList.remove('pop'), 180);
    }

    artStage.addEventListener('click', (e) => {
      e.stopPropagation();
      setSticker(curSticker + 1);
      burst(e.clientX, e.clientY, 10);
      if (navigator.vibrate) navigator.vibrate(12);
    });

    const lightSwitch = document.getElementById('lightSwitch');
    const lightLabel = document.getElementById('lightLabel');
    let redMode = false;
    lightSwitch.addEventListener('click', (e) => {
      e.stopPropagation();
      redMode = !redMode;
      document.body.classList.toggle('red-room', redMode);
      lightLabel.textContent = redMode ? 'свитч) красная' : 'свитч) тёплая';
      if (window.Telegram && Telegram.WebApp) {
        try { Telegram.WebApp.setHeaderColor(redMode ? '#0d0508' : '#09080c'); } catch (_) {}
      }
      burst(e.clientX, e.clientY, 8);
      if (navigator.vibrate) navigator.vibrate(15);
    });

    const sirenBtn = document.getElementById('sirenBtn');
    const sirenOverlay = document.getElementById('sirenOverlay');
    let sirenTimer = null;
    let lastHorny = 5;
    sirenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const nextHorny = curSticker === 4 ? 5 : curSticker === 5 ? 4 : (lastHorny === 4 ? 5 : 4);
      lastHorny = nextHorny;
      setSticker(nextHorny);
      sirenOverlay.classList.add('active');
      burst(window.innerWidth / 2, window.innerHeight * 0.28, 18);
      if (navigator.vibrate) navigator.vibrate([25, 45, 25]);
      clearTimeout(sirenTimer);
      sirenTimer = setTimeout(() => sirenOverlay.classList.remove('active'), 2400);
    });

    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    const particles = [];
    let rafId = 0;

    function resize() {
      const dpr = Math.min(1.5, window.devicePixelRatio || 1);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function drawHeart(c, s) {
      c.beginPath();
      c.moveTo(0, s * 0.35);
      c.bezierCurveTo(0, -s * 0.1, -s * 0.65, -s * 0.1, -s * 0.65, s * 0.25);
      c.bezierCurveTo(-s * 0.65, s * 0.6, 0, s * 0.9, 0, s * 1.05);
      c.bezierCurveTo(0, s * 0.9, s * 0.65, s * 0.6, s * 0.65, s * 0.25);
      c.bezierCurveTo(s * 0.65, -s * 0.1, 0, -s * 0.1, 0, s * 0.35);
      c.fill();
    }

    function drawStar(c, s) {
      c.fillRect(-s * 0.16, -s * 0.7, s * 0.32, s * 1.4);
      c.fillRect(-s * 0.7, -s * 0.16, s * 1.4, s * 0.32);
    }

    function ensureFxLoop() {
      if (!rafId) rafId = requestAnimationFrame(animParticles);
    }

    function burst(x, y, count = 10) {
      const kinds = ['27', '27', 'heart', '2∞', 'star'];
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
        const speed = 2.0 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          life: 1,
          decay: 0.018 + Math.random() * 0.016,
          kind: kinds[Math.floor(Math.random() * kinds.length)],
          size: 13 + Math.random() * 10,
          rot: (Math.random() - 0.5) * 0.5,
          vrot: (Math.random() - 0.5) * 0.06,
          color: Math.random() < 0.5 ? '#ffd26a' : '#ff5f85',
        });
      }
      ensureFxLoop();
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, .art-stage')) return;
      burst(e.clientX, e.clientY, 8);
    });

    function animParticles() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.rot += p.vrot;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.kind === 'heart') {
          drawHeart(ctx, p.size * 0.72);
        } else if (p.kind === 'star') {
          drawStar(ctx, p.size * 0.65);
        } else {
          ctx.font = `800 ${p.size}px Manrope, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.kind, 0, 0);
        }
        ctx.restore();
      }
      if (particles.length > 0) {
        rafId = requestAnimationFrame(animParticles);
      } else {
        rafId = 0;
      }
    }

    const dH = document.getElementById('dH');
    const dM = document.getElementById('dM');
    const dS = document.getElementById('dS');
    const lH = document.getElementById('lH');
    const lM = document.getElementById('lM');
    const lS = document.getElementById('lS');
    const uS = document.getElementById('uS');
    const progFill = document.getElementById('progFill');

    function decl(n, forms) {
      const m100 = Math.abs(n) % 100;
      const m10 = m100 % 10;
      if (m100 > 10 && m100 < 20) return forms[2];
      if (m10 > 1 && m10 < 5) return forms[1];
      if (m10 === 1) return forms[0];
      return forms[2];
    }

    let lastSec = -1;
    let arrived = false;

    function updateClock() {
      const now = Date.now();
      const remMs = TARGET_MS - now;
      const totalSpan = Math.max(1, TARGET_MS - START_MS);
      const pct = Math.max(0, Math.min(1, (now - START_MS) / totalSpan));

      progFill.style.transform = `scaleX(${pct.toFixed(5)})`;

      if (remMs <= 0) {
        dH.textContent = '00';
        dM.textContent = '00';
        dS.textContent = '00';
        lH.textContent = 'часов';
        lM.textContent = 'минут';
        lS.textContent = 'секунд';
        if (!arrived) {
          arrived = true;
          setSticker(2);
          setInterval(() => {
            burst(Math.random() * window.innerWidth, window.innerHeight * (0.2 + Math.random() * 0.4), 14);
          }, 900);
        }
        return;
      }

      const totalSec = Math.ceil(remMs / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      dH.textContent = String(h).padStart(2, '0');
      dM.textContent = String(m).padStart(2, '0');
      dS.textContent = String(s).padStart(2, '0');
      lH.textContent = decl(h, ['час', 'часа', 'часов']);
      lM.textContent = decl(m, ['минута', 'минуты', 'минут']);
      lS.textContent = decl(s, ['секунда', 'секунды', 'секунд']);

      if (s !== lastSec) {
        lastSec = s;
        uS.classList.add('tick');
        setTimeout(() => uS.classList.remove('tick'), 220);
      }
    }

    updateClock();
    setInterval(updateClock, 200);
  </script>
</body>
</html>
