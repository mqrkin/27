<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#09080c" />
  <title>27 · 11:20 МСК</title>
  <meta property="og:type" content="website" />
  <meta property="og:title" content="27 · 11:20 МСК" />
  <meta property="og:description" content="живой посекундный таймер до 27 ноября — и пара пасхалок внутри" />
  <meta property="og:image" content="https://mqrkin.github.io/27/assets/og_27.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09080c;
      --surface: rgba(255, 255, 255, 0.048);
      --surface-strong: rgba(255, 255, 255, 0.09);
      --ink: #f7f4ef;
      --ink-dim: rgba(247, 244, 239, 0.56);
      --accent: #f5a623;
      --accent-2: #ff6b8b;
      --glow-a: rgba(245, 166, 35, 0.22);
      --glow-b: rgba(255, 107, 139, 0.16);
      --ring: rgba(245, 166, 35, 0.36);
    }

    body.red-room {
      --bg: #0d0508;
      --surface: rgba(255, 36, 72, 0.08);
      --surface-strong: rgba(255, 36, 72, 0.15);
      --accent: #ff2a4d;
      --accent-2: #ff6e84;
      --glow-a: rgba(255, 26, 64, 0.34);
      --glow-b: rgba(255, 0, 51, 0.22);
      --ring: rgba(255, 42, 77, 0.52);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-x: hidden;
      transition: background 0.55s ease;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      transition: background 0.65s ease;
    }

    .orb-1 {
      width: 340px;
      height: 340px;
      top: -90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--glow-a);
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      bottom: -110px;
      right: -80px;
      background: var(--glow-b);
    }

    .siren-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .siren-overlay.active {
      opacity: 1;
      animation: sirenFlash 0.36s steps(2, end) infinite;
    }

    @keyframes sirenFlash {
      0% { box-shadow: inset 24px 0 90px rgba(255, 32, 64, 0.65), inset -24px 0 90px rgba(32, 130, 255, 0.08); }
      50% { box-shadow: inset 24px 0 90px rgba(255, 32, 64, 0.08), inset -24px 0 90px rgba(32, 130, 255, 0.65); }
      100% { box-shadow: inset 24px 0 90px rgba(255, 32, 64, 0.65), inset -24px 0 90px rgba(32, 130, 255, 0.08); }
    }

    #fxCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    .wrap {
      position: relative;
      z-index: 10;
      max-width: 440px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(14px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ink-dim);
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: dotPulse 1.5s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .switch-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      transition: transform 0.16s ease, background 0.3s ease;
    }

    .switch-btn:active {
      transform: scale(0.95);
    }

    .lamp-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: background 0.35s ease, box-shadow 0.35s ease;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 4px 0 2px;
    }

    .art-stage {
      position: relative;
      width: 196px;
      height: 196px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .art-img {
      width: 184px;
      height: 184px;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.52));
      animation: floaty 3.8s ease-in-out infinite;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s ease;
    }

    .art-stage.pop .art-img {
      transform: scale(1.09) rotate(-3deg);
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1.2deg); }
    }

    .art-hint {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-dim);
      min-height: 18px;
    }

    .timer-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px 16px 18px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      transition: background 0.45s ease;
    }

    .timer-title {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-dim);
      margin-bottom: 14px;
    }

    .clock-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    .unit {
      background: rgba(0, 0, 0, 0.34);
      border-radius: 18px;
      padding: 14px 6px 12px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.25s ease, transform 0.18s ease;
    }

    .unit.tick {
      box-shadow: inset 0 0 0 1px var(--ring), 0 0 22px var(--glow-a);
      transform: scale(1.025);
    }

    .digits {
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .unit-sec .digits {
      color: var(--accent);
      transition: color 0.4s ease;
    }

    .unit-label {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-dim);
      letter-spacing: 0.03em;
    }

    .colon {
      font-size: 28px;
      font-weight: 800;
      color: var(--ink-dim);
      padding-bottom: 16px;
      opacity: 0.7;
    }

    .progress-wrap {
      margin-top: 16px;
    }

    .progress-track {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 14px var(--accent);
      transition: width 0.35s linear, background 0.4s ease;
    }

    .progress-meta {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-dim);
      font-variant-numeric: tabular-nums;
    }

    .termo-card {
      background: var(--surface);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.16s ease, background 0.4s ease;
    }

    .termo-card:active {
      transform: scale(0.985);
    }

    .mug-box {
      position: relative;
      width: 84px;
      height: 84px;
      flex-shrink: 0;
    }

    .mug-box img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .mug-hot {
      clip-path: inset(100% 0 0 0);
      transition: clip-path 0.08s linear;
    }

    .termo-info {
      flex: 1;
      min-width: 0;
    }

    .termo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .termo-temp {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .termo-sub {
      margin-top: 4px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--ink-dim);
    }

    .termo-bar {
      margin-top: 9px;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    .termo-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff7a2f, #ffd056);
      border-radius: 999px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .act-btn {
      appearance: none;
      border: 0;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 12px;
      border-radius: 16px;
      background: var(--surface-strong);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.14s ease, background 0.3s ease;
    }

    .act-btn:active {
      transform: scale(0.96);
    }

    .act-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #120c0e;
      font-weight: 800;
    }

    .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .footer-note {
      margin-top: auto;
      text-align: center;
      font-size: 11.5px;
      color: var(--ink-dim);
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <div class="siren-overlay" id="sirenOverlay"></div>
  <canvas id="fxCanvas"></canvas>

  <main class="wrap">
    <header class="topbar">
      <div class="badge">
        <span class="live-dot"></span>
        <span>27 · 11:20 МСК</span>
      </div>
      <button class="switch-btn" id="lightSwitch" type="button">
        <span class="lamp-dot"></span>
        <span id="lightLabel">свитч) тёплая</span>
      </button>
    </header>

    <section class="hero">
      <div class="art-stage" id="artStage" title="Тапни, чтобы сменить стикер">
        <img class="art-img" id="artImg" src="assets/s27.webp" alt="27" />
      </div>
      <div class="art-hint" id="artHint">тапни по нам — ещё стикеры · тапни по фону — 27</div>
    </section>

    <section class="timer-card">
      <div class="timer-title" id="timerTitle">до 27 ноября осталось</div>
      <div class="clock-grid">
        <div class="unit">
          <div class="digits" id="dH">00</div>
          <div class="unit-label" id="lH">часов</div>
        </div>
        <div class="colon">:</div>
        <div class="unit">
          <div class="digits" id="dM">00</div>
          <div class="unit-label" id="lM">минут</div>
        </div>
        <div class="colon">:</div>
        <div class="unit unit-sec" id="uS">
          <div class="digits" id="dS">00</div>
          <div class="unit-label" id="lS">секунд</div>
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-fill" id="progFill"></div>
        </div>
        <div class="progress-meta">
          <span id="progLeft">26 ноя → 27 ноя 11:20</span>
          <span id="progPct">0.00%</span>
        </div>
      </div>
    </section>

    <section class="termo-card" id="termoCard">
      <div class="mug-box">
        <img src="assets/termo_cold.webp" alt="Холодная кружка" />
        <img class="mug-hot" id="mugHot" src="assets/termo_hot.webp" alt="ТермоДжек)" />
      </div>
      <div class="termo-info">
        <div class="termo-head">
          <span>ТермоДжек)</span>
          <span class="termo-temp" id="termoTemp">24°C</span>
        </div>
        <div class="termo-sub" id="termoSub">Зажми и держи пальцем, чтобы нагреть кружку</div>
        <div class="termo-bar">
          <div class="termo-bar-fill" id="termoBar"></div>
        </div>
      </div>
    </section>

    <section class="actions">
      <button class="act-btn" id="sirenBtn" type="button">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 18v-6a5 5 0 0 1 10 0v6"/>
          <path d="M5 21h14"/>
          <path d="M12 2v2M4.9 4.9l1.4 1.4M19.1 4.9l-1.4 1.4"/>
        </svg>
        <span>Хорни Полис</span>
      </button>
      <a class="act-btn act-primary" href="https://t.me/addstickers/icq27_sticker" target="_blank" rel="noopener">
        <span>2∞ · Стикерпак</span>
      </a>
    </section>

    <div class="footer-note" id="footerNote">а после 27 — только 2∞</div>
  </main>

  <script>
    if (window.Telegram && Telegram.WebApp) {
      try {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.setHeaderColor('#09080c');
        Telegram.WebApp.setBackgroundColor('#09080c');
      } catch (_) {}
    }

    const TARGET_MS = 1795767600000; // 2026-11-27 11:20:00 MSK (UTC+3)
    const START_MS  = 1795640400000; // 2026-11-26 00:00:00 MSK

    const stickers = [
      { src: 'assets/s27.webp',       caption: '27 · тот самый первый' },
      { src: 'assets/kiss.webp',      caption: 'жёсткий гиперфикс' },
      { src: 'assets/inf2.webp',      caption: '2∞ · после 27' },
      { src: 'assets/bunnies.webp',   caption: 'нереально грязные зайцы' },
      { src: 'assets/predator.webp',  caption: 'моя хищница)' },
      { src: 'assets/horny_boy.webp', caption: 'хорни полис · офицер на месте' },
      { src: 'assets/horny_girl.webp',caption: 'хорни полис · поймали с поличным' },
      { src: 'assets/dumaite.webp',   caption: 'думайте' },
      { src: 'assets/ant.webp',       caption: 'муравью хуй приделать' },
    ];
    let curSticker = 0;

    const artStage = document.getElementById('artStage');
    const artImg = document.getElementById('artImg');
    const artHint = document.getElementById('artHint');

    function setSticker(idx) {
      curSticker = ((idx % stickers.length) + stickers.length) % stickers.length;
      artStage.classList.add('pop');
      artImg.src = stickers[curSticker].src;
      artHint.textContent = stickers[curSticker].caption;
      setTimeout(() => artStage.classList.remove('pop'), 180);
    }

    artStage.addEventListener('click', (e) => {
      e.stopPropagation();
      setSticker(curSticker + 1);
      burst(e.clientX, e.clientY, 10);
      if (navigator.vibrate) navigator.vibrate(12);
    });

    const lightSwitch = document.getElementById('lightSwitch');
    const lightLabel = document.getElementById('lightLabel');
    let redMode = false;
    lightSwitch.addEventListener('click', (e) => {
      e.stopPropagation();
      redMode = !redMode;
      document.body.classList.toggle('red-room', redMode);
      lightLabel.textContent = redMode ? 'свитч) красная' : 'свитч) тёплая';
      if (window.Telegram && Telegram.WebApp) {
        try { Telegram.WebApp.setHeaderColor(redMode ? '#0d0508' : '#09080c'); } catch (_) {}
      }
      burst(e.clientX, e.clientY, 8);
      if (navigator.vibrate) navigator.vibrate(15);
    });

    const sirenBtn = document.getElementById('sirenBtn');
    const sirenOverlay = document.getElementById('sirenOverlay');
    let sirenTimer = null;
    sirenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSticker(Math.random() < 0.5 ? 5 : 6);
      sirenOverlay.classList.add('active');
      burst(window.innerWidth / 2, window.innerHeight * 0.25, 18);
      if (navigator.vibrate) navigator.vibrate([25, 45, 25]);
      clearTimeout(sirenTimer);
      sirenTimer = setTimeout(() => sirenOverlay.classList.remove('active'), 2400);
    });

    const termoCard = document.getElementById('termoCard');
    const mugHot = document.getElementById('mugHot');
    const termoTemp = document.getElementById('termoTemp');
    const termoSub = document.getElementById('termoSub');
    const termoBar = document.getElementById('termoBar');
    let heating = false;
    let heat = 0;
    let celebratedTermo = false;

    const startHeat = (e) => { e.stopPropagation(); heating = true; };
    const stopHeat  = () => { heating = false; };
    termoCard.addEventListener('pointerdown', startHeat);
    window.addEventListener('pointerup', stopHeat);
    window.addEventListener('pointercancel', stopHeat);

    function tickTermo() {
      if (heating) {
        heat = Math.min(1, heat + 0.015);
      } else if (heat > 0) {
        heat = Math.max(0, heat - 0.005);
        if (heat < 0.5) celebratedTermo = false;
      }
      const clipTop = Math.round((1 - heat) * 100);
      mugHot.style.clipPath = `inset(${clipTop}% 0 0 0)`;
      termoBar.style.width = `${Math.round(heat * 100)}%`;
      const deg = Math.round(24 + heat * 68);
      termoTemp.textContent = `${deg}°C`;
      if (heat >= 0.99) {
        termoSub.textContent = 'ТермоДжек проявился!)';
        if (!celebratedTermo) {
          celebratedTermo = true;
          const r = termoCard.getBoundingClientRect();
          burst(r.left + 50, r.top + 30, 14);
          if (navigator.vibrate) navigator.vibrate(20);
        }
      } else if (heating) {
        termoSub.textContent = 'Греем кружку… вот-вот появится';
      } else if (heat > 0.05) {
        termoSub.textContent = 'Остывает обратно в чёрную…';
      } else {
        termoSub.textContent = 'Зажми и держи пальцем, чтобы нагреть кружку';
      }
      requestAnimationFrame(tickTermo);
    }
    requestAnimationFrame(tickTermo);

    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    const particles = [];

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    function drawHeart(c, s) {
      c.beginPath();
      c.moveTo(0, s * 0.35);
      c.bezierCurveTo(0, -s * 0.1, -s * 0.65, -s * 0.1, -s * 0.65, s * 0.25);
      c.bezierCurveTo(-s * 0.65, s * 0.6, 0, s * 0.9, 0, s * 1.05);
      c.bezierCurveTo(0, s * 0.9, s * 0.65, s * 0.6, s * 0.65, s * 0.25);
      c.bezierCurveTo(s * 0.65, -s * 0.1, 0, -s * 0.1, 0, s * 0.35);
      c.fill();
    }

    function drawStar(c, s) {
      c.fillRect(-s * 0.16, -s * 0.7, s * 0.32, s * 1.4);
      c.fillRect(-s * 0.7, -s * 0.16, s * 1.4, s * 0.32);
    }

    function burst(x, y, count = 10) {
      const kinds = ['27', '27', 'heart', '2∞', 'star'];
      for (let i = 0; i < count; i++) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
        const speed = 2.0 + Math.random() * 4.2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          life: 1,
          decay: 0.015 + Math.random() * 0.015,
          kind: kinds[Math.floor(Math.random() * kinds.length)],
          size: 13 + Math.random() * 10,
          rot: (Math.random() - 0.5) * 0.5,
          vrot: (Math.random() - 0.5) * 0.06,
          color: Math.random() < 0.5 ? '#ffd26a' : '#ff5f85',
        });
      }
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button, a, .art-stage, .termo-card')) return;
      burst(e.clientX, e.clientY, 8);
    });

    function animParticles() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;
        p.rot += p.vrot;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.kind === 'heart') {
          drawHeart(ctx, p.size * 0.72);
        } else if (p.kind === 'star') {
          drawStar(ctx, p.size * 0.65);
        } else {
          ctx.font = `800 ${p.size}px Manrope, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.kind, 0, 0);
        }
        ctx.restore();
      }
      requestAnimationFrame(animParticles);
    }
    requestAnimationFrame(animParticles);

    const dH = document.getElementById('dH');
    const dM = document.getElementById('dM');
    const dS = document.getElementById('dS');
    const lH = document.getElementById('lH');
    const lM = document.getElementById('lM');
    const lS = document.getElementById('lS');
    const uS = document.getElementById('uS');
    const progFill = document.getElementById('progFill');
    const progPct = document.getElementById('progPct');
    const timerTitle = document.getElementById('timerTitle');
    const footerNote = document.getElementById('footerNote');

    function decl(n, forms) {
      const m100 = Math.abs(n) % 100;
      const m10 = m100 % 10;
      if (m100 > 10 && m100 < 20) return forms[2];
      if (m10 > 1 && m10 < 5) return forms[1];
      if (m10 === 1) return forms[0];
      return forms[2];
    }

    let lastSec = -1;
    let arrived = false;

    function updateClock() {
      const now = Date.now();
      const remMs = TARGET_MS - now;
      const totalSpan = Math.max(1, TARGET_MS - START_MS);
      const pct = Math.max(0, Math.min(100, ((now - START_MS) / totalSpan) * 100));

      progFill.style.width = `${pct.toFixed(3)}%`;
      progPct.textContent = `${pct.toFixed(2)}%`;

      if (remMs <= 0) {
        dH.textContent = '00';
        dM.textContent = '00';
        dS.textContent = '00';
        lH.textContent = 'часов';
        lM.textContent = 'минут';
        lS.textContent = 'секунд';
        timerTitle.textContent = '27 случилось · теперь 2∞';
        footerNote.textContent = 'урааааа, мы дождались · 2∞';
        if (!arrived) {
          arrived = true;
          setSticker(2);
          setInterval(() => {
            burst(Math.random() * window.innerWidth, window.innerHeight * (0.2 + Math.random() * 0.4), 14);
          }, 900);
        }
        return;
      }

      const totalSec = Math.ceil(remMs / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;

      dH.textContent = String(h).padStart(2, '0');
      dM.textContent = String(m).padStart(2, '0');
      dS.textContent = String(s).padStart(2, '0');
      lH.textContent = decl(h, ['час', 'часа', 'часов']);
      lM.textContent = decl(m, ['минута', 'минуты', 'минут']);
      lS.textContent = decl(s, ['секунда', 'секунды', 'секунд']);

      if (s !== lastSec) {
        lastSec = s;
        uS.classList.add('tick');
        setTimeout(() => uS.classList.remove('tick'), 220);
      }
    }

    updateClock();
    setInterval(updateClock, 200);
  </script>
</body>
</html>
